kestra:
  repository:
    type: memory
  queue:
    type: memory
  storage:
    type: local
    local:
      base-path: /tmp/unittest
  server:
    liveness:
      enabled: false
    termination-grace-period: 5s
  grpc:
    maxRetryAttempts: 1
    shutdownTimeout: 3s
  controller:
    # Random port outside the ephemeral range, as in Kestra's own tests, so parallel or leftover JVMs never collide on 50051.
    port: ${random.int[20000,32000]}
    maxConnectionAgeGrace: 0s
  worker:
    controllers:
      type: STATIC
      static:
        endpoints:
          - host: localhost
            port: ${kestra.controller.port}
# Disable Micronaut embedded gRPC server and health check
grpc:
  server:
    enabled: false
    health:
      enabled: false
